# 工作流名称
name: UPDATE DATE

# 工作流触发条件
on:
  # 定时任务：每 24 小时执行一次
  schedule:
    - cron: '0 0 */1 * *'

  # 允许手动触发
  workflow_dispatch:


# 允许 GitHub Actions 修改仓库内容
permissions:
  contents: write


# 工作流任务
jobs:
  update-date:
    runs-on: ubuntu-latest

    steps:
      # 步骤1：检出仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤2：更新 README 时间戳
      - name: Update README Timestamp
        run: |
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S")

          sed -i '/更新于/d' README.md
          echo "更新于 $CURRENT_TIME" >> README.md

      # 步骤3：提交并推送
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update README timestamp"
            git push
          else
            echo "README 没有变化，跳过提交"
          fi